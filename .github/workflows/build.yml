name: Build Pro Piano APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform 34
        run: |
          if [ ! -d "$ANDROID_HOME/platforms/android-34" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" > /dev/null || true
          fi

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Pro-Piano-v1.0.apk

      - name: Create release with APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.0 Pro-Piano-v1.0.apk \
            --title "Pro Piano v1.0" \
            --notes "Professional 88-Key Grand Piano Android App with Polyphonic Sound Synthesis, Instruments, Metronome, Recording/Playback & Song Tutorials." \
            || gh release upload v1.0 Pro-Piano-v1.0.apk --clobber
